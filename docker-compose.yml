services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eduparque
      POSTGRES_USER: eduparque
      POSTGRES_PASSWORD: eduparque
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduparque -d eduparque"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eduparque_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://eduparque:eduparque@postgres:5432/eduparque
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://eduparque:eduparque@postgres:5432/eduparque
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"
    volumes:
      - eduparque_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  eduparque_postgres:
  eduparque_storage:
